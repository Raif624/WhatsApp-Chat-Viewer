
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WhatsApp Chat Viewer</title>

    <!-- CSS file -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Main Application Container -->
    <div class="app-container">

        <!-- ========================= -->
        <!-- SIDEBAR -->
        <!-- ========================= -->

        <aside class="sidebar">

            <div class="sidebar-header">

                <h2>Chats</h2>

                <div class="sidebar-actions">

                    <button
                        id="importChatBtn"
                        type="button"
                        title="Import WhatsApp Chat"
                    >
                        + Import
                    </button>

                    <button id="settingsBtn" type="button">
                        ⚙
                    </button>

                </div>

            </div>

            <!-- Search Bar -->

            <div class="search-container">

                <input
                    type="text"
                    id="chatSearch"
                    placeholder="Search messages..."
                    autocomplete="off"
                >

            </div>

            <!-- Chat List -->

            <div class="chat-list" id="chatList">

                <!-- Chat items will be generated by JavaScript -->

            </div>

        </aside>


        <!-- ========================= -->
        <!-- MAIN CHAT SECTION -->
        <!-- ========================= -->

        <main class="chat-section">

            <!-- Chat Header -->

            <header class="chat-header">

                <div class="profile-avatar">
                    I
                </div>

                <div class="header-info">

                    <h3 id="contactName">
                        Imdad Cse Junior
                    </h3>

                    <p>Archived chat history</p>

                </div>

            </header>
            
            
            <!-- Message Filter Toolbar -->

            <div class="filter-toolbar">

                <!-- Sender Filter -->

                <label for="senderFilter">Sender:</label>

                <select id="senderFilter">

                    <option value="all">All messages</option>

                    <option value="me">My messages</option>

                    <option value="other">Imdad's messages</option>

                    <option value="system">System notifications</option>

                </select>


                <!-- Date Filter -->

                <label for="dateFilter">Date:</label>

                <input
                    type="date"
                    id="dateFilter"
                >


                <!-- Clear Date Button -->

                <button
                    type="button"
                    id="clearDateBtn"
                >
                    Clear date
                </button>

            </div>



            <!-- Message Display Area -->

            <section
                class="message-container"
                id="messageContainer"
            >

                <div class="date-separator">

                    <span>Chat History</span>

                </div>

                <div class="welcome-message">

                    <h2>WhatsApp Chat Viewer</h2>

                    <p>
                        Your archived conversation will
                        appear here.
                    </p>

                </div>

            </section>


            <!-- Chat Footer -->

            <footer class="chat-footer">

                <p>
                    This is an archived conversation.
                    You cannot send WhatsApp messages here.
                </p>

            </footer>

        </main>

    </div>


    <!-- JavaScript file -->
    <!-- ================================= -->
<!-- IMPORT CHAT PREVIEW MODAL -->
<!-- ================================= -->

    <div id="importModal" class="import-modal hidden">

        <div class="import-modal-content">

            <div class="import-modal-header">

                <h2>Import WhatsApp Chat</h2>

                <button id="closeImportBtn" type="button">
                    &times;
                </button>

            </div>


            <!-- ZIP FILE SELECTION -->

            <div id="uploadSection">

                <p>Select your exported WhatsApp ZIP file.</p>

                <input
                    type="file"
                    id="zipFileInput"
                    accept=".zip,application/zip"
                >

                <button
                    id="previewZipBtn"
                    type="button"
                >
                    Preview Chat
                </button>

            </div>


            <!-- PREVIEW RESULT -->

            <div id="previewSection" class="hidden">

                <h3 id="previewChatName"></h3>

                <p id="previewTextFile"></p>

                <p id="previewMessageInfo"></p>

                <p id="previewMediaInfo"></p>

                <div class="import-modal-actions">

                    <button
                        id="confirmImportBtn"
                        type="button"
                    >
                        Confirm Import
                    </button>

                    <button
                        id="cancelImportBtn"
                        type="button"
                    >
                        Cancel
                    </button>

                </div>

            </div>


            <!-- STATUS MESSAGE -->

            <p id="importStatus"></p>

        </div>

    </div>
    

    
    <!-- IMAGE PREVIEW MODAL -->

    <div id="imagePreviewModal" class="image-preview-modal hidden">

        <button
            id="closeImagePreview"
            class="close-image-preview"
            type="button"
        >
            &times;
        </button>

        <img
            id="previewImage"
            src=""
            alt="Image preview"
        >

        <a
            id="downloadPreviewImage"
            href=""
            download
        >
            ⬇ Download Image
        </a>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
